<!doctype html>
<html>
  <head>
    <title>Update Task</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        padding: 40px;
      }
      .container {
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        width: 400px;
      }
      h1 {
        color: #333;
        text-align: center;
      }
      input[type="text"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
        margin-bottom: 15px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #032c4e;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        background-color: #09f638;
      }
      .back {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #f2230c;
        text-decoration: none;
      }
      .back:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Update Task</h1>
      <form method="POST">
        <input type="text" name="task" value="{{ task }}" required />
        <button type="submit">Update</button>
      </form>
      <a href="/" class="back">← Back to Home</a>
    </div>
  </body>
</html>
